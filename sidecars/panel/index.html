<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目插件独立开关</title>
  <script>
    (function() {
      var isDark = true;
      try {
        var saved = localStorage.getItem("antigravity_theme_mode");
        if (saved === "light") isDark = false;
        else if (saved === "dark") isDark = true;
        else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) isDark = false;
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
    })();
  </script>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <div class="header">
    <div class="header-left">
      <h1 id="uiAppTitle">项目插件独立开关</h1>
      <span class="badge" id="uiBadge">Sidecar</span>
    </div>
    <div class="header-actions">
      <button class="secondary small" id="langToggleBtn" onclick="toggleLanguage()">EN</button>
      <button class="secondary small" id="refreshBtn" onclick="handleManualRefresh()">刷新</button>
    </div>
  </div>

  <!-- 核心项目选择与操作栏 -->
  <div class="project-bar">
    <div class="project-select-row">
      <!-- 隐藏原生 select 以保持 100% 向下兼容，同时展示现代化圆角悬浮下拉组件 -->
      <select id="projectSelect" onchange="onSelectProject()" style="display: none;">
        <option value="__default__">默认配置</option>
      </select>
      <div class="custom-dropdown" id="customProjectDropdown">
        <button type="button" class="dropdown-trigger" id="dropdownTriggerBtn" onclick="toggleCustomDropdown(event)">
          <span class="dropdown-trigger-text" id="dropdownSelectedLabel">默认配置</span>
          <svg class="dropdown-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 8 10 12 14 8"></polyline>
          </svg>
        </button>
        <div class="dropdown-menu" id="customDropdownMenu"></div>
      </div>
      <button class="secondary small" id="batchModeBtn" onclick="toggleBatchMode(event)">批量修改</button>
      <button class="danger small" id="uiResetProfileBtn" onclick="resetCurrentProfile()" style="display: none;">重置为默认</button>
    </div>

    <div class="project-status-note" id="projectStatusNote">-</div>
  </div>

  <!-- 插件开关列表 -->
  <div class="plugin-list" id="pluginList">
    <div style="text-align: center; color: var(--text-muted); padding: 16px;" id="uiLoadingText">正在加载项目与插件配置...</div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
